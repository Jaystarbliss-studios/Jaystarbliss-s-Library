<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#121216" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="silverRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0" />
      <stop offset="30%" stop-color="#71717a" />
      <stop offset="70%" stop-color="#a1a1aa" />
      <stop offset="100%" stop-color="#27272a" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="900" fill="url(#bgGrad)" />

  <!-- Subtle Editorial Frame Lines -->
  <rect x="30" y="30" width="540" height="840" fill="none" stroke="#27272a" stroke-width="1.5" />
  <rect x="36" y="36" width="528" height="828" fill="none" stroke="#18181b" stroke-width="1" />

  <!-- Top Publisher Mark -->
  <text x="300" y="80" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" font-weight="700" letter-spacing="4" fill="#a1a1aa">
    JAYSTARBLISS STUDIOS
  </text>
  <text x="300" y="100" text-anchor="middle" font-family="'Space Mono', monospace" font-size="9" letter-spacing="3" fill="#71717a">
    MEMOIR / LITERARY NON-FICTION
  </text>

  <!-- Center Decorative Geometric Motif (Echoing the book interior/cover) -->
  <g transform="translate(300, 260)">
    <!-- Concentric subtle editorial rings & crosshairs -->
    <circle r="90" fill="none" stroke="#1f1f23" stroke-width="1" stroke-dasharray="4 4" />
    <circle r="70" fill="none" stroke="#27272a" stroke-width="1.5" />
    <circle r="40" fill="none" stroke="#3f3f46" stroke-width="1" />
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#27272a" stroke-width="1" stroke-dasharray="6 6" />
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#27272a" stroke-width="1" stroke-dasharray="6 6" />
    
    <!-- Central Roman Numeral XX -->
    <text x="0" y="14" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="38" font-weight="700" letter-spacing="6" fill="#f4f4f5">
      XX
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="120" y1="410" x2="480" y2="410" stroke="url(#silverRule)" stroke-width="1.5" />

  <!-- Main Title: TWO DECADES -->
  <!-- Bold, Stark, Monumental Typography -->
  <text x="300" y="475" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Poppins', sans-serif" font-size="44" font-weight="900" letter-spacing="6" fill="#ffffff">
    TWO DECADES
  </text>

  <!-- Tagline: 7305 DAYS OF LIVING ON AN EARTHLY DEFINITION OF HELL -->
  <text x="300" y="525" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" letter-spacing="2.5" fill="#e4e4e7">
    7305 DAYS OF LIVING ON AN
  </text>
  <text x="300" y="546" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" letter-spacing="2.5" fill="#f43f5e">
    EARTHLY DEFINITION OF HELL
  </text>

  <!-- Editorial Commentary Box / Minimalist Block -->
  <rect x="90" y="600" width="420" height="96" fill="#121215" stroke="#27272a" stroke-width="1" />
  <line x1="90" y1="600" x2="90" y2="696" stroke="#ffffff" stroke-width="3" />
  
  <text x="114" y="630" font-family="'Space Mono', monospace" font-size="9" letter-spacing="2" fill="#a1a1aa">
    MANUSCRIPT CLASSIFICATION:
  </text>
  <text x="114" y="652" font-family="'Newsreader', 'Cambria', serif" font-size="14" font-style="italic" fill="#e4e4e7">
    "An unflinching chronicle of memory, survival, and defiance."
  </text>
  <text x="114" y="675" font-family="'Space Mono', monospace" font-size="9" letter-spacing="1.5" fill="#71717a">
    FIRST OFFICIAL SERIALIZED RELEASE • LAGOS, NIGERIA
  </text>

  <!-- Bottom Details & Barcode / Monospace Spec -->
  <g transform="translate(60, 790)">
    <text x="0" y="0" font-family="'Space Mono', monospace" font-size="9.5" letter-spacing="2" fill="#71717a">
      AUTHOR: JAYSTARBLISS
    </text>
    <text x="0" y="18" font-family="'Space Mono', monospace" font-size="9" letter-spacing="1.5" fill="#52525b">
      PUB. ID: JSB-LIB-001
    </text>

    <!-- Faux Minimal Barcode -->
    <g transform="translate(360, -15)">
      <line x1="0" y1="0" x2="0" y2="35" stroke="#71717a" stroke-width="2" />
      <line x1="6" y1="0" x2="6" y2="35" stroke="#71717a" stroke-width="1" />
      <line x1="10" y1="0" x2="10" y2="35" stroke="#71717a" stroke-width="3" />
      <line x1="16" y1="0" x2="16" y2="35" stroke="#71717a" stroke-width="1" />
      <line x1="22" y1="0" x2="22" y2="35" stroke="#71717a" stroke-width="2" />
      <line x1="28" y1="0" x2="28" y2="35" stroke="#71717a" stroke-width="4" />
      <line x1="36" y1="0" x2="36" y2="35" stroke="#71717a" stroke-width="1" />
      <line x1="42" y1="0" x2="42" y2="35" stroke="#71717a" stroke-width="2.5" />
      <line x1="52" y1="0" x2="52" y2="35" stroke="#71717a" stroke-width="1.5" />
      <line x1="60" y1="0" x2="60" y2="35" stroke="#71717a" stroke-width="3" />
      <line x1="70" y1="0" x2="70" y2="35" stroke="#71717a" stroke-width="1" />
      <line x1="80" y1="0" x2="80" y2="35" stroke="#71717a" stroke-width="2" />
      <text x="40" y="46" text-anchor="middle" font-family="'Space Mono', monospace" font-size="7" fill="#52525b">
        978-0-7305-XX
      </text>
    </g>
  </g>
</svg>
