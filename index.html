  <body class="bg-[#09090d] text-[#f4f6fb] antialiased selection:bg-teal-500/20 selection:text-teal-200">
    <div id="root"></div>

    <!-- Reading-progress guard for cross-device and cloud sync consistency -->
    <script>
      (() => {
        const KEY = 'jsb_reading_progress';
        const SHADOW_KEY = 'jsb_reading_progress_latest';
        let restoring = false;
        const read = (key) => {
          try {
            const value = JSON.parse(localStorage.getItem(key) || '[]');
            return Array.isArray(value) ? value : [];
          } catch (_) { return []; }
        };
        const time = (value) => {
          const parsed = Date.parse(value || '');
          return Number.isFinite(parsed) ? parsed : 0;
        };
        const identity = (record) => `${record?.userId || ''}::${record?.bookId || ''}`;
        const newest = (records) => {
          const map = new Map();
          records.forEach((record) => {
            if (!record || !record.userId || !record.bookId) return;
            const key = identity(record);
            const existing = map.get(key);
            if (!existing || time(record.lastReadAt) >= time(existing.lastReadAt)) map.set(key, record);
          });
          return Array.from(map.values());
        };
        const shadow = (records) => {
          try { localStorage.setItem(SHADOW_KEY, JSON.stringify(newest(records))); } catch (_) {}
        };
        const reconcile = () => {
          if (restoring) return;
          const current = read(KEY);
          const merged = newest([...current, ...read(SHADOW_KEY)]);
          const currentMap = new Map(newest(current).map((item) => [identity(item), item]));
          const changed = merged.some((item) => {
            const currentItem = currentMap.get(identity(item));
            return !currentItem || time(item.lastReadAt) > time(currentItem.lastReadAt);
          });
          shadow(merged);
          if (!changed) return;
          restoring = true;
          try { localStorage.setItem(KEY, JSON.stringify(merged)); }
          finally { restoring = false; }
          window.dispatchEvent(new CustomEvent('jsb_library_updated', { detail: { key: KEY, source: 'reading-progress-guard' } }));
        };
        shadow(read(KEY));
        window.addEventListener('jsb_library_updated', (event) => {
          if (event?.detail?.key === KEY) reconcile();
        });
        window.setInterval(reconcile, 2500);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
